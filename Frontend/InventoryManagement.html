<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Management</title>
<style>
body {
  margin: 0;
  background: white;
  color: black;
  font-family: Arial, sans-serif;
}

.navbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid #cccccc;
}

.brand {
  font-size: 22px;
  font-weight: bold;
}

.nav-link {
  padding: 8px 16px;
  border: 2px solid white;
  border-radius: 20px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

.nav-link.active {
  border-color: #4f46e5;
  color: #4f46e5;
}

.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.center {
  padding-top: 80px;
  text-align: center;
}

.big-text {
  margin-bottom: 40px;
  font-size: 30px;
  font-weight: bold;
}

.big-button {
  padding: 20px 48px;
  border: none;
  border-radius: 12px;
  background: #4f46e5;
  color: white;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat {
  padding: 20px;
  border: 1px solid #cccccc;
  border-radius: 10px;
}

.stat-number {
  font-size: 32px;
  font-weight: bold;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}

.card {
  padding: 16px;
  border: 1px solid #cccccc;
  border-radius: 10px;
}

.tag {
  padding: 3px 10px;
  border-radius: 20px;
  background: #7c3aed;
  color: white;
  font-size: 13px;
}

.edit-button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #dbeafe;
  color: #1e40af;
  cursor: pointer;
}

.delete-button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #fee2e2;
  color: #991b1b;
  cursor: pointer;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 90%;
  max-width: 400px;
  max-height: 90%;
  overflow-y: auto;
  padding: 24px;
  border-radius: 10px;
  background: white;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input,
select {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 8px;
  border: 1px solid #cccccc;
  border-radius: 8px;
  font-size: 16px;
}

.cancel-button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #eeeeee;
  font-size: 16px;
  cursor: pointer;
}

.save-button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #16a34a;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">Inventory Management</div>
  <button id="navAdd" class="nav-link active" onclick="showAddPage()">Addition</button>
  <button id="navInventory" class="nav-link" onclick="showInventoryPage()">Inventory</button>
</div>

<div id="pageAdd" class="page center">
  <div class="big-text">Keep track of what you stock, how many you have and what it’s worth!</div>
  <button class="big-button" onclick="openModal()">+ Add Item</button>
</div>

<div id="pageInventory" class="page" style="display: none;">
  <h1>Inventory</h1>

  <div class="stats">
    <div class="stat">
      <div id="statItems" class="stat-number" style="color: #4f46e5;">0</div>
      <div>Items</div>
    </div>
    <div class="stat">
      <div id="statUnits" class="stat-number" style="color: #db2777;">0</div>
      <div>Units in stock</div>
    </div>
    <div class="stat">
      <div id="statValue" class="stat-number" style="color: #16a34a;">0 ₸</div>
      <div>Total value</div>
    </div>
  </div>

  <p>
    Sort by
    <select id="sortSelect" onchange="showItems()" style="display: inline; width: auto;">
      <option value="">Order added</option>
      <option value="name-az">Name (A–Z)</option>
      <option value="name-za">Name (Z–A)</option>
      <option value="price-low">Price (low to high)</option>
      <option value="price-high">Price (high to low)</option>
      <option value="quantity-low">Quantity (low to high)</option>
      <option value="quantity-high">Quantity (high to low)</option>
    </select>
  </p>

  <p id="emptyMessage">Your inventory is empty, please head to to the Addition page to add your first item.</p>
  <div id="cards" class="cards"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Add item</h2>

    <form onsubmit="saveItem(event)">
      <label>
        Item name
        <input type="text" id="nameInput" required>
      </label>

      <label>
        Category
        <select id="categoryInput">
          <option>General</option>
          <option>Food and Drink</option>
          <option>Clothing</option>
          <option>Electronics</option>
          <option>Supplies</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Quantity
        <input type="text" id="quantityInput" inputmode="numeric" oninput="onlyNumbers(this)" required>
      </label>

      <label>
        Price per item (₸)
        <input type="text" id="priceInput" inputmode="numeric" oninput="onlyNumbers(this)" required>
      </label>

      <br>
      <button type="submit" class="save-button">Save item</button>
      <button type="button" class="cancel-button" onclick="closeModal()">Cancel</button>
    </form>
  </div>
</div>

<script>
let items = [];
let editIndex = null;

function onlyNumbers(box) {
  box.value = box.value.replace(/[^0-9]/g, "");
}

function formatMoney(number) {
  return number.toLocaleString("ru-RU") + " ₸";
}

function showAddPage() {
  document.getElementById("pageAdd").style.display = "block";
  document.getElementById("pageInventory").style.display = "none";
  document.getElementById("navAdd").className = "nav-link active";
  document.getElementById("navInventory").className = "nav-link";
}

function showInventoryPage() {
  document.getElementById("pageAdd").style.display = "none";
  document.getElementById("pageInventory").style.display = "block";
  document.getElementById("navAdd").className = "nav-link";
  document.getElementById("navInventory").className = "nav-link active";
}

function showStats() {
  let totalUnits = 0;
  let totalValue = 0;

  for (let i = 0; i < items.length; i++) {
    totalUnits = totalUnits + items[i].quantity;
    totalValue = totalValue + items[i].quantity * items[i].price;
  }

  document.getElementById("statItems").textContent = items.length;
  document.getElementById("statUnits").textContent = totalUnits;
  document.getElementById("statValue").textContent = formatMoney(totalValue);
}

function showItems() {
  const choice = document.getElementById("sortSelect").value;

  if (choice === "name-az") {
    items.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  if (choice === "name-za") {
    items.sort(function (a, b) { return b.name.localeCompare(a.name); });
  }
  if (choice === "price-low") {
    items.sort(function (a, b) { return a.price - b.price; });
  }
  if (choice === "price-high") {
    items.sort(function (a, b) { return b.price - a.price; });
  }
  if (choice === "quantity-low") {
    items.sort(function (a, b) { return a.quantity - b.quantity; });
  }
  if (choice === "quantity-high") {
    items.sort(function (a, b) { return b.quantity - a.quantity; });
  }

  let html = "";

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    html += "<div class='card'>";
    html += "<span class='tag'>" + item.category + "</span>";
    html += "<h3>" + item.name + "</h3>";
    html += "<p>Quantity: <b>" + item.quantity + "</b></p>";
    html += "<p>Price: <b>" + formatMoney(item.price) + "</b></p>";
    html += "<p>Total value: <b>" + formatMoney(item.quantity * item.price) + "</b></p>";
    html += "<button class='edit-button' onclick='editItem(" + i + ")'>Edit</button> ";
    html += "<button class='delete-button' onclick='deleteItem(" + i + ")'>Delete</button>";
    html += "</div>";
  }

  document.getElementById("cards").innerHTML = html;

  if (items.length === 0) {
    document.getElementById("emptyMessage").style.display = "block";
  } else {
    document.getElementById("emptyMessage").style.display = "none";
  }

  showStats();
}

function openModal() {
  editIndex = null;
  document.getElementById("modalTitle").textContent = "Add item";
  document.getElementById("nameInput").value = "";
  document.getElementById("categoryInput").value = "General";
  document.getElementById("quantityInput").value = "";
  document.getElementById("priceInput").value = "";
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function editItem(index) {
  editIndex = index;
  document.getElementById("modalTitle").textContent = "Edit item";
  document.getElementById("nameInput").value = items[index].name;
  document.getElementById("categoryInput").value = items[index].category;
  document.getElementById("quantityInput").value = items[index].quantity;
  document.getElementById("priceInput").value = items[index].price;
  document.getElementById("modal").style.display = "flex";
}

function deleteItem(index) {
  if (confirm("Delete this item?")) {
    items.splice(index, 1);
    showItems();
  }
}

function saveItem(event) {
  event.preventDefault();

  const item = {
    name: document.getElementById("nameInput").value,
    category: document.getElementById("categoryInput").value,
    quantity: Number(document.getElementById("quantityInput").value),
    price: Number(document.getElementById("priceInput").value)
  };

  if (editIndex === null) {
    items.push(item);
  } else {
    items[editIndex] = item;
  }

  showItems();
  closeModal();
}

showItems();
</script>
</body>
</html>
